version: '3.8'

services:
  web:
    build: .
    ports:
      - "8000:8000"
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - MONGODB_URI=mongodb://mongo:27017/swasya_ai
      - MONGODB_DB_NAME=swasya_ai
      - SECRET_KEY=swasya-ai-production-secret-key
    depends_on:
      - mongo
    restart: unless-stopped

  mongo:
    image: mongo:6.0
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    restart: unless-stopped

volumes:
  mongo_data:
